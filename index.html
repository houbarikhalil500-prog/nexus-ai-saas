<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI</title>
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config={theme:{extend:{colors:{darkBg:'#0b0f19',darkCard:'#131a26',accentIndigo:'#6366f1',accentEmerald:'#10b981'}}}}
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased p-4">
    <!-- Header -->
    <nav class="max-w-4xl mx-auto flex justify-between items-center py-4 border-b border-gray-800 mb-8">
        <span class="text-xl font-bold bg-gradient-to-l from-accentIndigo to-accentEmerald bg-clip-text text-transparent">Nexus AI Web3</span>
        <span class="bg-darkCard border border-gray-700 text-accentEmerald px-3 py-1 rounded-xl text-xs font-mono">0x89A52e...</span>
    </nav>
    <!-- Hero -->
    <header class="text-center max-w-2xl mx-auto mb-12">
        <h1 class="text-3xl sm:text-5xl font-extrabold mb-4">توليد وبيع المنتجات الرقمية بـ <span class="text-accentEmerald">USDT</span></h1>
        <p class="text-sm text-gray-400">أنتج أدوات ذكية، نماذج إكسل، ونصوص تسويقية بنقرة واحدة عبر الذكاء الاصطناعي.</p>
    </header>
    <!-- Dashboard -->
    <section class="max-w-4xl mx-auto bg-darkCard border border-gray-800 rounded-2xl p-6 mb-8">
        <span class="text-xs text-gray-400 block mb-1">💵 الرصيد المتاح للسحب (USDT AVAILABLE)</span>
        <div class="flex items-baseline gap-2 mb-4">
            <span class="text-3xl font-black font-mono">2,880.50</span>
            <span class="text-sm font-bold text-accentEmerald">USDT</span>
        </div>
        <div class="flex gap-2">
            <button onclick="simSale()" class="bg-accentEmerald/10 text-accentEmerald text-xs font-bold py-2 px-4 rounded-xl border border-accentEmerald/20 hover:bg-accentEmerald/20 transition">⚡ محاكاة بيع (+39\$)</button>
            <button onclick="payout()" class="bg-accentIndigo text-white text-xs font-bold py-2 px-4 rounded-xl hover:bg-indigo-600 transition">↗ سحب الأرباح فوراً</button>
        </div>
    </section>
    <!-- Generator -->
    <section class="max-w-4xl mx-auto bg-darkCard border border-gray-800 rounded-2xl p-6 mb-12">
        <h2 class="text-lg font-bold mb-4">مساحة عمل الذكاء الاصطناعي (Gemini Workspace)</h2>
        <textarea id="promptInput" rows="3" class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-gray-100 focus:outline-none focus:border-accentIndigo mb-4" placeholder="مثال: اكتب باقة نصوص تسويقية لبيع الساعات، أو جدول إكسل للمخازن..."></textarea>
        <button onclick="genProduct()" id="genBtn" class="w-full bg-gradient-to-r from-accentIndigo to-indigo-600 text-white font-bold py-3 rounded-xl text-sm transition">توليد المنتج الرقمي الآن</button>
        <div id="outBox" class="hidden mt-4 pt-4 border-t border-gray-800">
            <span class="text-xs font-bold text-accentEmerald block mb-2">المنتج الرقمي الجاهز:</span>
            <div id="outText" class="w-full bg-darkBg p-4 rounded-xl text-xs text-gray-300 font-mono whitespace-pre-wrap leading-relaxed"></div>
        </div>
    </section>
    <!-- Logic -->
    <script>
        const KEY = "AQ.Ab8RN6I1EF_xWK1LSYpKXtMZ4JKU-2TP-4VbPf40up706Ab_Yg";
        const WALLET = "TYnJW395RFhCnpowLBtEiHWys88tg5FeiU";
        async function genProduct() {
            const input = document.getElementById('promptInput').value.trim();
            const btn = document.getElementById('genBtn');
            const box = document.getElementById('outBox');
            const txt = document.getElementById('outText');
            if(!input) { alert('الرجاء كتابة الوصف أولاً!'); return; }
            btn.disabled = true; btn.innerText = '⏳ جاري التوليد...';
            box.classList.remove('hidden'); txt.innerText = 'اتصال بمحرك Gemini...';
            try {
                const res = await fetch(`https://googleapis.com{KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Create an extensive expert digital asset file or comprehensive copywriting bundle structured beautifully in Arabic based on: " + input }] }] })
                });
                const data = await res.json();
                if(data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    txt.innerText = data.candidates[0].content.parts[0].text;
                } else { txt.innerText = '❌ خطأ في معالجة البيانات.'; }
            } catch(e) { txt.innerText = '❌ فشل الاتصال بالخادم الرئيسي.'; }
            finally { btn.disabled = false; btn.innerText = 'توليد المنتج الرقمي الآن'; }
        }
        function payout() { alert("🚀 تم تقديم طلب السحب الفوري!\n\nسيتم إرسال الأرباح إلى محفظتك المربوطة:\n\n" + WALLET); }
        function simSale() { alert("💵 مبيعات محاكاة ناجحة! تم تحديث سجل الأرباح بـ +39 USDT."); }
    </script>
</body>
</html>
