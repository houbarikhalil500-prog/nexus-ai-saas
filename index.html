    // --- Web Audio Synthesizer ---
    class SoundFx {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      }
      playClick() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch(e) {}
      }
      playSuccess() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.05, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.25);
          });
        } catch(e) {}
      }

        if (!this.enabled) return;

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.3);
          });
        } catch(e) {}
      }

                      <div className="grid grid-cols-2 gap-2 pt-1">

                      >
                        <IconZap className="h-3.5 w-3.5 text-emerald-400" />
                        <span>Publish & Trigger Live Sale (+${currentProduct.priceUSDT} USDT)</span>

              <div className="relative overflow-hidden rounded-2xl border border-slate-800 bg-[#090d16] p-5 sm:p-7 shadow-2xl">

                        return (
                          <button
                            key={netKey}
                            type="button"
                            onClick={() => {
                              sfx.playClick();
                              setPayoutNetwork(netKey);
                              setPayoutAddress(cfg.addressSample);
                            }}
                            className={`p-3 rounded-xl border text-left transition-all ${
                              isSelected
                                ? 'border-emerald-500 bg-emerald-950/30 text-white shadow-lg'
                                : 'border-slate-800 bg-[#0a0d17] text-slate-400 hover:border-slate-700'
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-bold font-mono text-slate-100">{netKey}</span>
                              <span className="text-[10px] font-mono text-emerald-400 font-semibold">{cfg.speed}</span>
                            </div>
                            <p className="text-[11px] text-slate-400 mt-1 truncate">{cfg.name}</p>
                            <p className="text-[10px] font-mono text-slate-400 mt-0.5">Fee: ${cfg.fee.toFixed(2)}</p>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="space-y-2">
                    <div className="flex items-center justify-between text-xs">
                      <label className="font-mono font-semibold text-slate-300 uppercase tracking-wider">
                        Payout Amount // المبلغ المراد سحبه
                      </label>
                      <span className="font-mono text-slate-400">
                        Max: <span className="text-white font-bold">{balanceUSDT.toFixed(2)} USDT</span>
                      </span>
                    </div>

                    <div className="relative">
                      <input
                        type="number"
                        step="0.01"
                        min="1"
                        max={balanceUSDT}
                        value={payoutAmount}
                        onChange={(e) => setPayoutAmount(e.target.value)}
                        placeholder="Enter USDT amount..."
                        className="w-full rounded-xl border border-slate-800 bg-[#06080f] px-4 py-3 font-mono text-lg font-bold text-white placeholder-slate-600 focus:border-emerald-500 outline-none tabular-nums"
                      />
                      <div className="absolute right-3 top-2.5 flex items-center gap-1.5">
                        <span className="text-xs font-mono font-bold text-emerald-400 mr-1">USDT</span>
                        <button
                          type="button"
                          onClick={() => {
                            sfx.playClick();
                            setPayoutAmount((balanceUSDT * 0.5).toFixed(2));
                          }}
                          className="px-2 py-1 rounded bg-slate-800 text-[10px] font-mono hover:bg-slate-700 text-slate-300"
                        >
                          50%
                        </button>
                        <button
                          type="button"
                          onClick={() => {
                            sfx.playClick();
                            setPayoutAmount(balanceUSDT.toFixed(2));
                          }}
                          className="px-2 py-1 rounded bg-emerald-600 text-[10px] font-mono font-bold text-white hover:bg-emerald-500"
                        >
                          MAX
                        </button>
                      </div>
                    </div>
                  </div>

                      </label>
                      <span className="text-[11px] font-mono text-slate-400">
                        {payoutNetwork === 'TRC20' ? 'Starts with T (Tron)' : 'Starts with 0x (EVM)'}
                      </span>
                    </div>

                    <div className="relative">
                      <input
                        type="text"
                        value={payoutAddress}
                        onChange={(e) => setPayoutAddress(e.target.value.trim())}

                        className="w-full rounded-xl border border-slate-800 bg-[#06080f] px-4 py-3 font-mono text-xs sm:text-sm text-slate-100 placeholder-slate-600 focus:border-emerald-500 outline-none"
                      />
                      <button
                        type="button"
                        onClick={async () => {
                          sfx.playClick();
                          try {
                            const clip = await navigator.clipboard.readText();
                            if (clip) setPayoutAddress(clip.trim());
                          } catch(err) {
                            setPayoutAddress(currentNetworkConfig.addressSample);
                          }
                        }}
                        className="absolute right-3 top-2.5 px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-[11px] font-mono text-slate-300"

                        Paste

                    <p className="text-[11px] text-slate-400 font-arabic">

                    {transactions.map(tx => (
                      <tr key={tx.id} className="hover:bg-slate-900/40 transition-colors">

                            <span className="inline-flex items-center gap-1 text-emerald-400 font-bold">
                              <IconArrowUpRight className="h-3.5 w-3.5" /> PAYOUT
                            </span>

                            <span className="inline-flex items-center gap-1 text-indigo-400 font-bold">
                              <IconArrowDownRight className="h-3.5 w-3.5" /> SALE

                        <td className="px-4 py-3.5 font-sans">

                            {tx.type === 'payout' ? '-' : '+'}${tx.amount.toFixed(2)}

                        </td>
                        <td className="px-4 py-3.5 hidden sm:table-cell text-slate-400">
                          <div className="flex items-center gap-1.5">
                            <span className="text-[11px]">{tx.txHash}</span>
                            <button onClick={() => handleCopy(tx.txHash, tx.id)} className="hover:text-white">
                              <IconCopy className="h-3 w-3" />
                            </button>
                          </div>
                        </td>
                        <td className="px-4 py-3.5 text-right whitespace-nowrap">
                          <span className="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            CONFIRMED

                </table>
              </div>

                <span className="font-extrabold text-white">Nexus AI</span>
                <span>·</span>
                <span className="font-arabic">منصة نكسوس الرقمية الذكية</span>

                <span>Non-Custodial USDT Settlement</span>
              </div>
              <div className="flex items-center gap-4">
                <button
                  onClick={() => {
                    sfx.playClick();
                    setBalanceUSDT(2845.50);
                  }}
                  className="hover:text-slate-200 transition-colors font-mono"
                >
                  Reset Demo Balance
                </button>
                <span>·</span>
                <span className="font-mono text-slate-400">© 2026 Nexus AI Protocol</span>
              </div>

          {/* WALLET CONNECT MODAL */}
          {isWalletModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

                    <IconWallet className="h-5 w-5 text-indigo-400" />

                    <IconX className="h-5 w-5" />

                <div className="space-y-2">

                    { name: 'TronLink Pro (TRC-20)', address: 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t', net: 'TRC20' },
                    { name: 'MetaMask (ERC-20 / L2)', address: '0x89A52e09B...43Eb87B', net: 'ERC20' },
                    { name: 'Phantom Multi-Chain', address: '0x71C83e9b...a50F9a7', net: 'POLYGON' },
                    { name: 'WalletConnect v2', address: '0xFd086bC...1C0b69F', net: 'ARBITRUM' }

                    <button
                      key={idx}
                      onClick={() => {
                        sfx.playSuccess();
                        setConnectedWallet({ name: w.name, address: w.address, network: w.net });

                        setIsWalletModalOpen(false);

                      className="w-full flex items-center justify-between p-3.5 rounded-xl border border-slate-800 bg-[#06080f] hover:border-indigo-500/60 hover:bg-slate-900 transition-all text-left"
                    >
                      <div>
                        <p className="text-xs font-bold text-white">{w.name}</p>
                        <p className="text-[11px] font-mono text-slate-400">{w.address}</p>
                      </div>
                      <IconChevronRight className="h-4 w-4 text-slate-400" />
                    </button>

                </div>

                {isWalletConnected && (
                  <button
                    onClick={() => {
                      sfx.playClick();
                      setIsWalletConnected(false);

                    Disconnect Active Wallet

                )}
              </div>
            </div>
          )}

          {/* PAYOUT SUCCESS MODAL */}
          {payoutModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-lg rounded-2xl border border-slate-800 bg-[#090d16] p-6 sm:p-7 shadow-2xl space-y-5">
                
                {payoutStep === 'broadcasting' && (
                  <div className="text-center py-6 space-y-4">
                    <IconRefreshCw className="h-10 w-10 text-emerald-400 animate-spin mx-auto" />
                    <h3 className="text-lg font-bold text-white">Broadcasting to Blockchain Node</h3>
                    <p className="text-xs font-mono text-slate-400">Routing transaction across {payoutNetwork} liquidity contracts...</p>
                  </div>
                )}

                {payoutStep === 'confirming' && (
                  <div className="text-center py-6 space-y-4">
                    <IconShieldCheck className="h-10 w-10 text-indigo-400 mx-auto" />
                    <h3 className="text-lg font-bold text-white">Validating Consensus Signatures</h3>
                    <p className="text-xs font-mono text-slate-400">Confirmed 12/12 blocks. Dispatching USDT payload...</p>
                  </div>
                )}

                {payoutStep === 'completed' && completedTxDetails && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <div>
                        <h3 className="text-base font-bold text-white">Payout Dispatched Successfully</h3>
                        <p className="text-xs font-arabic text-emerald-400">تم إرسال الأرباح بنجاح إلى محفظتك</p>
                      </div>
                      <button onClick={() => setPayoutModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                        <IconX className="h-5 w-5" />
                      </button>
                    </div>

                    <div className="rounded-xl border border-slate-800 bg-[#05070d] p-4 font-mono text-xs space-y-2.5">
                      <div className="flex justify-between">
                        <span className="text-slate-400">Net Dispatched:</span>
                        <span className="text-emerald-400 font-bold text-sm">
                          +${(completedTxDetails.amount - NETWORK_CONFIGS[payoutNetwork].fee).toFixed(2)} USDT
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Network Rail:</span>
                        <span className="text-white font-semibold">{completedTxDetails.network}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Destination:</span>
                        <span className="text-slate-200 truncate max-w-[240px]">{completedTxDetails.address}</span>
                      </div>
                      <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                        <span className="text-slate-400">Transaction Hash:</span>
                        <span className="text-indigo-400 truncate max-w-[160px]">{completedTxDetails.txHash}</span>

                    <button
                      onClick={() => setPayoutModalOpen(false)}

                      Return to Workspace
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
